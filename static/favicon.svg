<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Straw Hat - Main shape -->
  <ellipse cx="32" cy="38" rx="30" ry="10" fill="#F4A623" stroke="#C47F17" stroke-width="2"/>
  <!-- Hat brim highlight -->
  <ellipse cx="32" cy="38" rx="26" ry="7" fill="#F7BC4D" opacity="0.5"/>
  <!-- Hat dome -->
  <ellipse cx="32" cy="30" rx="18" ry="16" fill="#F4A623" stroke="#C47F17" stroke-width="2"/>
  <!-- Hat dome highlight -->
  <ellipse cx="28" cy="24" rx="10" ry="8" fill="#F7BC4D" opacity="0.4"/>
  <!-- Red ribbon/band -->
  <rect x="14" y="30" width="36" height="6" rx="2" fill="#D32F2F" stroke="#B71C1C" stroke-width="1"/>
  <!-- Ribbon texture lines -->
  <line x1="18" y1="31" x2="18" y2="35" stroke="#B71C1C" stroke-width="0.8" opacity="0.5"/>
  <line x1="24" y1="31" x2="24" y2="35" stroke="#B71C1C" stroke-width="0.8" opacity="0.5"/>
  <line x1="30" y1="31" x2="30" y2="35" stroke="#B71C1C" stroke-width="0.8" opacity="0.5"/>
  <line x1="36" y1="31" x2="36" y2="35" stroke="#B71C1C" stroke-width="0.8" opacity="0.5"/>
  <line x1="42" y1="31" x2="42" y2="35" stroke="#B71C1C" stroke-width="0.8" opacity="0.5"/>
  <!-- Straw texture on dome -->
  <line x1="22" y1="20" x2="22" y2="29" stroke="#C47F17" stroke-width="0.6" opacity="0.4"/>
  <line x1="27" y1="17" x2="27" y2="29" stroke="#C47F17" stroke-width="0.6" opacity="0.4"/>
  <line x1="32" y1="15" x2="32" y2="29" stroke="#C47F17" stroke-width="0.6" opacity="0.4"/>
  <line x1="37" y1="17" x2="37" y2="29" stroke="#C47F17" stroke-width="0.6" opacity="0.4"/>
  <line x1="42" y1="20" x2="42" y2="29" stroke="#C47F17" stroke-width="0.6" opacity="0.4"/>
</svg>
