<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Judi's Wishlist</h1>

    <div id="status" class="status"></div>

    <!-- Method selector - always visible -->
    <div id="methodSelector" class="method-selector">
      <button id="methodScanBtn" class="method-btn active">
        <span class="method-icon">🔍</span>
        <span class="method-label">Scan Page</span>
      </button>
      <button id="methodShareBtn" class="method-btn">
        <span class="method-icon">🔗</span>
        <span class="method-label">Share Link</span>
      </button>
    </div>

    <!-- Scan current page section -->
    <div id="scanSection" class="import-section">
      <div id="storeInfo" class="store-info hidden">
        <span id="storeBadge" class="store-badge"></span>
        <span id="storeName"></span>
      </div>

      <div id="unsupportedMsg" class="message hidden">
        <p>This page is not a cart.</p>
        <p class="hint">Navigate to a Temu or Amazon cart page first.</p>
      </div>

      <div id="scanControls" class="hidden">
        <div class="list-selector">
          <label for="listSelect">Add to list:</label>
          <select id="listSelect">
            <option value="1">Main List</option>
          </select>
        </div>

        <button id="importBtn" class="btn btn-primary">
          Import Cart Items
        </button>
      </div>

      <div id="result" class="result hidden"></div>
    </div>

    <!-- Share link section -->
    <div id="shareSection" class="import-section hidden">
      <div class="share-input-wrapper">
        <input type="text" id="shareLink" placeholder="Paste Temu share link here..." class="share-input">
        <button id="sharePasteBtn" class="btn-paste" title="Paste from clipboard">📋</button>
      </div>

      <div class="list-selector">
        <label for="shareListSelect">Add to list:</label>
        <select id="shareListSelect">
          <option value="1">Main List</option>
        </select>
      </div>

      <button id="shareImportBtn" class="btn btn-primary">
        Import from Share Link
      </button>

      <div id="shareResult" class="result hidden"></div>
    </div>

    <div class="footer">
      <a href="http://localhost:5000" target="_blank">Open Wishlist</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
