{% extends "base.html" %}

{% block content %}
<div class="controls">
    <div class="list-selector">
        <label for="listSelect">List:</label>
        <select id="listSelect" class="list-dropdown">
            <option value="">All Lists</option>
        </select>
    </div>
</div>

<nav class="category-tabs" id="categoryTabs">
    <button class="tab active" data-category="">All</button>
</nav>

<div class="items-grid" id="itemsGrid">
    <div class="loading">Loading items...</div>
</div>

<div id="readyToBuySection" class="ready-to-buy-section hidden">
    <div id="readyToBuyContent"></div>
</div>

<!-- Add Item Modal (for testing) -->
<div id="addItemModal" class="modal hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Add Item</h2>
            <button class="close-btn" id="closeAddModal">&times;</button>
        </div>
        <form id="addItemForm">
            <div class="form-group">
                <label for="itemStore">Store</label>
                <select id="itemStore" required>
                    <option value="temu">Temu</option>
                    <option value="amazon">Amazon</option>
                </select>
            </div>
            <div class="form-group">
                <label for="itemTitle">Title</label>
                <input type="text" id="itemTitle" required>
            </div>
            <div class="form-group">
                <label for="itemUrl">Product URL</label>
                <input type="url" id="itemUrl" required>
            </div>
            <div class="form-group">
                <label for="itemProductId">Product ID</label>
                <input type="text" id="itemProductId" required>
            </div>
            <div class="form-group">
                <label for="itemImage">Image URL</label>
                <input type="url" id="itemImage">
            </div>
            <div class="form-group">
                <label for="itemPrice">Price</label>
                <input type="number" id="itemPrice" step="0.01" min="0">
            </div>
            <div class="form-group">
                <label for="itemQuantity">Quantity</label>
                <input type="number" id="itemQuantity" value="1" min="1">
            </div>
            <div class="form-group">
                <label for="itemCategory">Category</label>
                <select id="itemCategory"></select>
            </div>
            <div class="form-group">
                <label for="itemList">List</label>
                <select id="itemList"></select>
            </div>
            <button type="submit" class="btn btn-primary">Add Item</button>
        </form>
    </div>
</div>

<button id="addItemBtn" class="fab" title="Add Item">+</button>
{% endblock %}
